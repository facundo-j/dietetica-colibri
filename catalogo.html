<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C85A1A">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catálogo - Dietética Colibrí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --naranja: #C85A1A;
    --naranja-suave: #F2E8DF;
    --naranja-medio: #E8C9AD;
    --tierra: #8B4513;
    --crema: #FDF8F3;
    --texto: #2C1A0E;
    --texto-suave: #7A5C42;
    --borde: rgba(200, 90, 26, 0.15);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
    padding-bottom: 3rem;
  }

  /* ── HEADER ── */
  header {
    background: var(--naranja);
    color: white;
    text-align: center;
    padding: 1.5rem 1rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(200,90,26,0.25);
  }
  header .sub { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.8; margin-bottom: 0.1rem; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 700; letter-spacing: 0.04em; line-height: 1; }
  header .tagline { font-size: 0.72rem; opacity: 0.75; margin-top: 0.3rem; }

  /* ── BACK BTN ── */
  .back-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: none;
    border: none;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    margin-bottom: 0.5rem;
    opacity: 0.9;
    transition: opacity 0.15s;
    text-decoration: none;
  }
  .back-btn:hover { opacity: 1; background: rgba(255,255,255,0.15); }
  .back-btn svg { width: 14px; height: 14px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── BUSCADOR + FILTROS ── */
  .controles {
    padding: 1rem 1rem 0.5rem;
    position: sticky;
    top: 88px;
    background: var(--crema);
    z-index: 90;
    border-bottom: 1px solid var(--borde);
  }

  .search-wrap {
    position: relative;
    margin-bottom: 0.75rem;
  }
  .search-wrap input {
    width: 100%;
    padding: 0.6rem 1rem 0.6rem 2.4rem;
    border: 1.5px solid var(--naranja-medio);
    border-radius: 30px;
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--texto);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--naranja); }
  .search-wrap input::placeholder { color: var(--texto-suave); }
  .search-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    opacity: 0.4;
  }

  .filtros {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 0.5rem;
  }
  .filtros::-webkit-scrollbar { display: none; }

  .filtro-btn {
    flex-shrink: 0;
    padding: 0.35rem 0.85rem;
    border-radius: 20px;
    border: 1.5px solid var(--naranja-medio);
    background: white;
    color: var(--texto-suave);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .filtro-btn.activo {
    background: var(--naranja);
    border-color: var(--naranja);
    color: white;
  }

  /* ── CONTENIDO ── */
  .contenido { padding: 1rem 1rem 0; }

  /* ── SECCIÓN CATEGORÍA ── */
  .seccion { margin-bottom: 1.5rem; }
  .seccion-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--naranja);
    font-weight: 700;
    margin-bottom: 0.75rem;
    padding-left: 0.1rem;
    border-left: 3px solid var(--naranja);
    padding-left: 0.6rem;
    line-height: 1.2;
  }

  /* ── TARJETAS ── */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  .card {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--borde);
    padding: 0.75rem 0.75rem 0.65rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    transition: box-shadow 0.18s, transform 0.18s;
  }
  .card:active { transform: scale(0.98); }

  .card-nombre {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--texto);
    line-height: 1.3;
  }

  .card-gramaje {
    font-size: 0.7rem;
    color: var(--texto-suave);
    font-weight: 300;
  }

  .card-precio {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--naranja);
    margin-top: auto;
    padding-top: 0.2rem;
  }

  .card-precio .por-kg {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.65rem;
    color: var(--texto-suave);
    font-weight: 400;
    display: block;
    margin-top: -0.1rem;
  }

  /* ── ESTADOS ── */
  .estado {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--texto-suave);
  }
  .estado svg { margin: 0 auto 0.75rem; display: block; opacity: 0.3; }
  .estado p { font-size: 0.9rem; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--naranja-medio);
    border-top-color: var(--naranja);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ÚLTIMA ACTUALIZACIÓN ── */
  .actualizacion {
    text-align: center;
    font-size: 0.7rem;
    color: var(--texto-suave);
    opacity: 0.6;
    padding: 1.5rem 1rem 0.5rem;
  }

  /* ── HIDDEN ── */
  .oculto { display: none; }

  /* ── BOTON PEDIR ── */
  .fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.25rem;
    background: var(--naranja);
    color: white;
    border: none;
    border-radius: 28px;
    padding: 0.75rem 1.25rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(200,90,26,0.35);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    z-index: 200;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(200,90,26,0.3); }
  .fab svg { width: 16px; height: 16px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn" style="display:inline-flex;">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Volver a pedidos
  </a>
  <div class="sub">Dietética</div>
  <h1>COLIBRÍ</h1>
  <div class="tagline">Lista de precios · Rosario</div>
</header>

<div class="controles">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="buscador" placeholder="Buscar producto..." autocomplete="off">
  </div>
  <div class="filtros" id="filtros">
    <button class="filtro-btn activo" data-cat="Todos">Todos</button>
  </div>
</div>

<div class="contenido" id="contenido">
  <div class="estado" id="estado-carga">
    <div class="spinner"></div>
    <p>Cargando catálogo...</p>
  </div>
</div>

<div class="actualizacion" id="actualizacion" style="display:none;">
  Los precios se actualizan automáticamente desde el listado oficial.
</div>

<a href="index.html" class="fab">
  <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
  Hacer un pedido
</a>

<script>
// ══════════════════════════════════════════════════
//  CONFIGURACIÓN
// ══════════════════════════════════════════════════
const SHEET_ID   = '1C7N6VRPxoQpRaYdLpLTnbqTm3HlI9feJZJ0fuhtmyzI';
const SHEET_NAME = 'Lista Publico';
// ══════════════════════════════════════════════════

const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

let datos = [];
let categoriaActiva = 'Todos';
let busqueda = '';

// La hoja "Lista Publico" tiene:
//   col 0: Categoría | col 1: Producto | col 2: (vacía) | col 3: Por 250 grs | col 4: Por 500 grs | col 5: Por 1 Kg
// Los productos cerrados (Pasta de Maní) tienen: col 3: Gramaje | col 4: Precio

async function cargarDatos() {
  try {
    const res = await fetch(URL);
    if (!res.ok) throw new Error('No se pudo cargar');
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?$/, ''));
    const filas = json.table.rows;

    datos = [];
    let categoriaActual = '';

    filas.forEach(fila => {
      const c = fila.c;
      if (!c || c.length < 2) return;

      const col0 = c[0]?.v?.toString().trim() || '';
      const col1 = c[1]?.v?.toString().trim() || '';

      // Actualizar categoría si la columna A tiene valor
      if (col0 && col0 !== 'Categoría' && !col0.startsWith('⬇') && !col0.startsWith('*') && col0 !== 'Atentis!') {
        categoriaActual = col0;
      }

      if (!col1 || col1 === 'Producto') return;

      const p250  = c[3]?.v;
      const p500  = c[4]?.v;
      const p1kg  = c[5]?.v;

      // Producto cerrado: col3 = gramaje texto, col4 = precio
      if (typeof p250 === 'string' && p250.includes('grs')) {
        const precio = c[4]?.v;
        if (precio) {
          datos.push({ categoria: categoriaActual, nombre: col1, tipo: 'cerrado', gramaje: p250, precio });
        }
        return;
      }

      // Producto a granel: puede tener 250g, 500g, 1kg
      if (p250) datos.push({ categoria: categoriaActual, nombre: col1, tipo: 'granel', gramaje: '250 g', precio: p250 });
      if (p500) datos.push({ categoria: categoriaActual, nombre: col1, tipo: 'granel', gramaje: '500 g', precio: p500 });
      if (p1kg) datos.push({ categoria: categoriaActual, nombre: col1, tipo: 'granel', gramaje: '1 kg',  precio: p1kg });
    });

    // Agrupar: un item por producto con todos sus gramajes
    const mapa = new Map();
    datos.forEach(d => {
      const key = d.categoria + '||' + d.nombre;
      if (!mapa.has(key)) {
        mapa.set(key, { categoria: d.categoria, nombre: d.nombre, tipo: d.tipo, precios: [] });
      }
      mapa.get(key).precios.push({ gramaje: d.gramaje, precio: d.precio });
    });

    datos = [...mapa.values()].filter(d => d.nombre && d.precios.length > 0);

    renderFiltros();
    renderCatalogo();
    document.getElementById('actualizacion').style.display = 'block';
  } catch (e) {
    console.error(e);
    document.getElementById('estado-carga').innerHTML = `
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>No se pudo cargar el catálogo.<br><small>Verificá que el Sheet esté publicado (Archivo → Compartir → Publicar en la web).</small></p>`;
  }
}

function formatPrecio(n) {
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function renderFiltros() {
  const cats = ['Todos', ...new Set(datos.map(d => d.categoria).filter(Boolean))];
  const cont = document.getElementById('filtros');
  cont.innerHTML = cats.map(c =>
    `<button class="filtro-btn${c === categoriaActiva ? ' activo' : ''}" data-cat="${c}">${c}</button>`
  ).join('');
  cont.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      categoriaActiva = btn.dataset.cat;
      cont.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      renderCatalogo();
    });
  });
}

function renderCatalogo() {
  const cont = document.getElementById('contenido');
  const termino = busqueda.toLowerCase().trim();

  let filtrados = datos.filter(d => {
    const coincidecat = categoriaActiva === 'Todos' || d.categoria === categoriaActiva;
    const coincidebusq = !termino ||
      d.nombre.toLowerCase().includes(termino) ||
      d.categoria.toLowerCase().includes(termino);
    return coincidecat && coincidebusq;
  });

  if (!filtrados.length) {
    cont.innerHTML = `
      <div class="estado">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p>No se encontraron productos.</p>
      </div>`;
    return;
  }

  // Agrupar por categoría
  const grupos = {};
  filtrados.forEach(d => {
    const cat = d.categoria || 'Otros';
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(d);
  });

  cont.innerHTML = Object.entries(grupos).map(([cat, prods]) => `
    <div class="seccion">
      <div class="seccion-titulo">${cat}</div>
      <div class="cards-grid">
        ${prods.map(p => {
          if (p.tipo === 'cerrado') {
            return `
              <div class="card">
                <div class="card-nombre">${p.nombre}</div>
                <div class="card-gramaje">${p.precios[0].gramaje}</div>
                <div class="card-precio">${formatPrecio(p.precios[0].precio)}</div>
              </div>`;
          }
          // Granel: mostrar todos los gramajes
          const preciosHTML = p.precios.map(pr =>
            `<div class="card-precio">${formatPrecio(pr.precio)}<span class="por-kg">${pr.gramaje}</span></div>`
          ).join('');
          return `
            <div class="card">
              <div class="card-nombre">${p.nombre}</div>
              ${preciosHTML}
            </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

document.getElementById('buscador').addEventListener('input', e => {
  busqueda = e.target.value;
  renderCatalogo();
});

cargarDatos();
</script>
</body>
</html>
